# Petalpace nginx config
# configure.sh replaces YOUR_DOMAIN and certbot adds HTTPS.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Planner saves can carry new attachments, up to the app's 44 MB limit.
    client_max_body_size 45m;

    # Proxy all requests to the Node.js server
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Required for SSE (real-time sync) — disables buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
    }
}
